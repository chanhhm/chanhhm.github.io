<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公司负面舆情监测系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .content {
            padding: 30px;
        }
        
        .form-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        
        input[type="text"], input[type="date"], select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus, input[type="date"]:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .radio-group, .checkbox-group {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        
        .radio-item, .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .date-group {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        
        .date-group > div {
            flex: 1;
        }
        
        .date-group > span {
            color: #666;
            font-weight: bold;
        }
        
        .button-group {
            text-align: center;
            margin: 30px 0;
        }
        
        button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            margin: 0 10px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .results-section {
            background: #fff;
            border-radius: 10px;
            padding: 25px;
            border: 1px solid #e1e5e9;
        }
        
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e1e5e9;
        }
        
        .results-header h3 {
            color: #333;
            font-size: 1.5em;
        }
        
        .results-content {
            max-height: 500px;
            overflow-y: auto;
        }
        
        .result-item {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            transition: box-shadow 0.3s;
        }
        
        .result-item:hover {
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .result-title {
            font-weight: bold;
            color: #d9534f;
            margin-bottom: 10px;
            font-size: 1.1em;
        }
        
        .result-meta {
            font-size: 0.9em;
            color: #6c757d;
            margin-bottom: 10px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .result-summary {
            color: #495057;
            line-height: 1.6;
        }
        
        .progress-bar {
            width: 100%;
            height: 20px;
            background-color: #f0f0f0;
            border-radius: 10px;
            overflow: hidden;
            margin: 20px 0;
            display: none;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s;
        }
        
        .status {
            padding: 15px;
            background-color: #e7f3ff;
            border-radius: 8px;
            margin-top: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #0066cc;
        }
        
        .no-results {
            text-align: center;
            padding: 50px;
            color: #6c757d;
            font-size: 1.1em;
        }
        
        @media (max-width: 768px) {
            .date-group {
                flex-direction: column;
                gap: 10px;
            }
            
            .date-group > span {
                align-self: center;
            }
            
            .radio-group, .checkbox-group {
                flex-direction: column;
                gap: 10px;
            }
            
            .button-group {
                flex-direction: column;
                gap: 10px;
            }
            
            button {
                width: 100%;
                margin: 5px 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 公司负面舆情监测系统</h1>
            <p>实时监测企业负面信息，助力风险管控</p>
        </div>
        
        <div class="content">
            <div class="form-section">
                <div class="form-group">
                    <label for="company">🏢 公司名称:</label>
                    <input type="text" id="company" placeholder="请输入公司名称，例如：阿里巴巴、腾讯等" value="阿里巴巴集团">
                </div>
                
                <div class="form-group">
                    <label>🔍 搜索模式:</label>
                    <div class="radio-group">
                        <div class="radio-item">
                            <input type="radio" id="fuzzy" name="searchMode" checked>
                            <label for="fuzzy">模糊搜索</label>
                        </div>
                        <div class="radio-item">
                            <input type="radio" id="exact" name="searchMode">
                            <label for="exact">准确搜索</label>
                        </div>
                    </div>
                </div>
                
                <div class="form-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="parentCompany" checked>
                        <label for="parentCompany">📋 包含母公司/集团</label>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>📅 日期范围:</label>
                    <div class="date-group">
                        <div>
                            <label for="startDate">起始日期:</label>
                            <input type="date" id="startDate" value="2023-09-01">
                        </div>
                        <span>至</span>
                        <div>
                            <label for="endDate">结束日期:</label>
                            <input type="date" id="endDate" value="2023-10-31">
                        </div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>⚠️ 负面舆情类型:</label>
                    <div class="checkbox-group">
                        <div class="checkbox-item">
                            <input type="checkbox" id="creditRisk" checked>
                            <label for="creditRisk">信用风险</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="complianceRisk" checked>
                            <label for="complianceRisk">监管合规风险</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="countryRisk" checked>
                            <label for="countryRisk">国别风险</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="operationalRisk">
                            <label for="operationalRisk">经营风险</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="legalRisk">
                            <label for="legalRisk">法律风险</label>
                        </div>
                    </div>
                </div>
                
                <div class="button-group">
                    <button id="searchBtn">🚀 开始搜索</button>
                    <button id="exportBtn">📤 导出结果</button>
                    <button id="clearBtn">🗑️ 清空结果</button>
                </div>
                
                <div class="progress-bar" id="progressBar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                
                <div class="status" id="status">
                    <span>✅ 就绪 - 请填写公司名称并点击搜索</span>
                </div>
            </div>
            
            <div class="results-section">
                <div class="results-header">
                    <h3>📊 搜索结果</h3>
                </div>
                <div class="results-content" id="resultsContent">
                    <div class="no-results" id="noResults">
                        等待搜索结果...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const searchBtn = document.getElementById('searchBtn');
            const exportBtn = document.getElementById('exportBtn');
            const clearBtn = document.getElementById('clearBtn');
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');
            const status = document.getElementById('status');
            const resultsContent = document.getElementById('resultsContent');
            const noResults = document.getElementById('noResults');
            
            // 设置日期输入框的默认值
            const today = new Date();
            const thirtyDaysAgo = new Date();
            thirtyDaysAgo.setDate(today.getDate() - 30);
            
            document.getElementById('startDate').valueAsDate = thirtyDaysAgo;
            document.getElementById('endDate').valueAsDate = today;
            
            // 搜索功能
            searchBtn.addEventListener('click', function() {
                const company = document.getElementById('company').value.trim();
                if (!company) {
                    alert('请输入公司名称');
                    return;
                }
                
                // 显示进度条
                progressBar.style.display = 'block';
                status.innerHTML = '<span>🔍 正在搜索中...</span>';
                searchBtn.disabled = true;
                
                // 模拟搜索过程
                simulateSearch(company);
            });
            
            // 模拟搜索函数
            function simulateSearch(company) {
                // 模拟网络延迟
                let progress = 0;
                const interval = setInterval(() => {
                    progress += 10;
                    progressFill.style.width = progress + '%';
                    
                    if (progress >= 100) {
                        clearInterval(interval);
                        
                        // 搜索完成，显示结果
                        setTimeout(() => {
                            progressBar.style.display = 'none';
                            searchBtn.disabled = false;
                            
                            // 生成模拟结果
                            const results = generateMockResults(company);
                            displayResults(results);
                            
                            status.innerHTML = `<span>✅ 搜索完成 - 找到 ${results.length} 条结果</span>`;
                        }, 500);
                    }
                }, 100);
            }
            
            // 生成模拟结果
            function generateMockResults(company) {
                const riskTypes = [];
                if (document.getElementById('creditRisk').checked) riskTypes.push('信用风险');
                if (document.getElementById('complianceRisk').checked) riskTypes.push('监管合规风险');
                if (document.getElementById('countryRisk').checked) riskTypes.push('国别风险');
                if (document.getElementById('operationalRisk').checked) riskTypes.push('经营风险');
                if (document.getElementById('legalRisk').checked) riskTypes.push('法律风险');
                
                if (riskTypes.length === 0) return [];
                
                const baseResults = [
                    {
                        title: `${company}因财务问题被评级机构下调信用评级`,
                        date: '2023-10-15',
                        type: '信用风险',
                        source: '财经新闻',
                        summary: `${company}因近期财务表现不佳，被知名评级机构下调信用评级，可能影响其融资成本。`
                    },
                    {
                        title: `监管机构对${company}展开合规调查`,
                        date: '2023-10-10',
                        type: '监管合规风险',
                        source: '监管公告',
                        summary: `监管机构宣布对${company}展开合规性调查，重点关注其内部控制和合规管理。`
                    },
                    {
                        title: `${company}在某国面临政策风险`,
                        date: '2023-10-05',
                        type: '国别风险',
                        source: '国际新闻',
                        summary: `${company}在某国的业务因当地政策变化面临不确定性，可能影响其海外收入。`
                    },
                    {
                        title: `${company}卷入法律纠纷`,
                        date: '2023-09-28',
                        type: '法律风险',
                        source: '法律公告',
                        summary: `${company}因合同纠纷被起诉，案件仍在审理中，结果尚不确定。`
                    },
                    {
                        title: `${company}高管变动引发关注`,
                        date: '2023-09-20',
                        type: '经营风险',
                        source: '公司公告',
                        summary: `${company}多名高管离职，市场担忧其管理稳定性。`
                    }
                ];
                
                // 过滤结果
                const filteredResults = [];
                const startDate = new Date(document.getElementById('startDate').value);
                const endDate = new Date(document.getElementById('endDate').value);
                
                for (const result of baseResults) {
                    const resultDate = new Date(result.date);
                    if (resultDate >= startDate && resultDate <= endDate && riskTypes.includes(result.type)) {
                        filteredResults.push(result);
                    }
                }
                
                return filteredResults;
            }
            
            // 显示结果
            function displayResults(results) {
                if (results.length === 0) {
                    resultsContent.innerHTML = '<div class="no-results">未找到相关负面舆情信息</div>';
                    return;
                }
                
                let html = '';
                results.forEach((result, index) => {
                    html += `
                        <div class="result-item">
                            <div class="result-title">${result.title}</div>
                            <div class="result-meta">
                                <span>📅 日期: ${result.date}</span>
                                <span>⚠️ 类型: ${result.type}</span>
                                <span>来源: ${result.source}</span>
                            </div>
                            <div class="result-summary">${result.summary}</div>
                        </div>
                    `;
                });
                
                resultsContent.innerHTML = html;
            }
            
            // 导出功能
            exportBtn.addEventListener('click', function() {
                const content = resultsContent.innerText || '暂无结果';
                const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `舆情监测结果_${new Date().toISOString().split('T')[0]}.txt`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                status.innerHTML = '<span>📤 结果已导出</span>';
            });
            
            // 清空结果
            clearBtn.addEventListener('click', function() {
                resultsContent.innerHTML = '<div class="no-results">等待搜索结果...</div>';
                status.innerHTML = '<span>🗑️ 结果已清空</span>';
            });
            
            // 日期验证
            document.getElementById('startDate').addEventListener('change', validateDates);
            document.getElementById('endDate').addEventListener('change', validateDates);
            
            function validateDates() {
                const startDate = new Date(document.getElementById('startDate').value);
                const endDate = new Date(document.getElementById('endDate').value);
                
                if (startDate > endDate) {
                    alert('起始日期不能晚于结束日期');
                    document.getElementById('endDate').value = document.getElementById('startDate').value;
                }
            }
        });
    </script>
</body>
</html>
