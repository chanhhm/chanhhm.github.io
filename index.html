<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公司负面舆情监测系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .content {
            padding: 30px;
        }
        
        .form-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        
        input[type="text"], input[type="date"], select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus, input[type="date"]:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .radio-group, .checkbox-group {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        
        .radio-item, .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .date-group {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        
        .date-group > div {
            flex: 1;
        }
        
        .date-group > span {
            color: #666;
            font-weight: bold;
        }
        
        .button-group {
            text-align: center;
            margin: 30px 0;
        }
        
        button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            margin: 0 10px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .results-section {
            background: #fff;
            border-radius: 10px;
            padding: 25px;
            border: 1px solid #e1e5e9;
        }
        
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e1e5e9;
        }
        
        .results-header h3 {
            color: #333;
            font-size: 1.5em;
        }
        
        .results-content {
            max-height: 500px;
            overflow-y: auto;
        }
        
        .result-item {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            transition: box-shadow 0.3s;
        }
        
        .result-item:hover {
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .result-title {
            font-weight: bold;
            color: #d9534f;
            margin-bottom: 10px;
            font-size: 1.1em;
        }
        
        .result-meta {
            font-size: 0.9em;
            color: #6c757d;
            margin-bottom: 10px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .result-summary {
            color: #495057;
            line-height: 1.6;
        }
        
        .progress-bar {
            width: 100%;
            height: 20px;
            background-color: #f0f0f0;
            border-radius: 10px;
            overflow: hidden;
            margin: 20px 0;
            display: none;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s;
        }
        
        .status {
            padding: 15px;
            background-color: #e7f3ff;
            border-radius: 8px;
            margin-top: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #0066cc;
        }
        
        .no-results {
            text-align: center;
            padding: 50px;
            color: #6c757d;
            font-size: 1.1em;
        }
        
        .api-info {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
            color: #856404;
        }
        
        .api-info h4 {
            margin-bottom: 10px;
            color: #856404;
        }
        
        .search-link {
            display: block;
            background: #e7f3ff;
            border: 1px solid #b8daff;
            border-radius: 8px;
            padding: 10px;
            margin: 10px 0;
            text-decoration: none;
            color: #0066cc;
            font-weight: bold;
        }
        
        .search-link:hover {
            background: #d4ebff;
        }
        
        @media (max-width: 768px) {
            .date-group {
                flex-direction: column;
                gap: 10px;
            }
            
            .date-group > span {
                align-self: center;
            }
            
            .radio-group, .checkbox-group {
                flex-direction: column;
                gap: 10px;
            }
            
            .button-group {
                flex-direction: column;
                gap: 10px;
            }
            
            button {
                width: 100%;
                margin: 5px 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 公司负面舆情监测系统</h1>
            <p>实时监测企业负面信息，助力风险管控</p>
        </div>
        
        <div class="content">
            <div class="form-section">
                <div class="api-info">
                    <h4>💡 使用說明</h4>
                    <p>此版本提供Google搜索功能：</p>
                    <ol>
                        <li>輸入公司名稱和選擇搜索選項</li>
                        <li>點擊搜索按鈕創建Google搜索鏈接</li>
                        <li>點擊生成的鏈接在新標籤頁搜索真實信息</li>
                    </ol>
                </div>
                
                <div class="form-group">
                    <label for="company">🏢 公司名称:</label>
                    <input type="text" id="company" placeholder="请输入公司名称，例如：阿里巴巴、腾讯等" value="阿里巴巴">
                </div>
                
                <div class="form-group">
                    <label>🔍 搜索模式:</label>
                    <div class="radio-group">
                        <div class="radio-item">
                            <input type="radio" id="fuzzy" name="searchMode" checked>
                            <label for="fuzzy">模糊搜索</label>
                        </div>
                        <div class="radio-item">
                            <input type="radio" id="exact" name="searchMode">
                            <label for="exact">准确搜索</label>
                        </div>
                    </div>
                </div>
                
                <div class="form-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="parentCompany" checked>
                        <label for="parentCompany">📋 包含母公司/集团</label>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>📅 日期范围:</label>
                    <div class="date-group">
                        <div>
                            <label for="startDate">起始日期:</label>
                            <input type="date" id="startDate" value="2023-09-01">
                        </div>
                        <span>至</span>
                        <div>
                            <label for="endDate">结束日期:</label>
                            <input type="date" id="endDate" value="2023-10-31">
                        </div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>⚠️ 负面舆情类型:</label>
                    <div class="checkbox-group">
                        <div class="checkbox-item">
                            <input type="checkbox" id="creditRisk" checked>
                            <label for="creditRisk">信用风险</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="complianceRisk" checked>
                            <label for="complianceRisk">监管合规风险</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="countryRisk" checked>
                            <label for="countryRisk">国别风险</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="operationalRisk">
                            <label for="operationalRisk">经营风险</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="legalRisk">
                            <label for="legalRisk">法律风险</label>
                        </div>
                    </div>
                </div>
                
                <div class="button-group">
                    <button id="searchBtn">🔗 生成Google搜索鏈接</button>
                    <button id="clearBtn">🗑️ 清空結果</button>
                </div>
                
                <div id="searchLinksContainer" style="display:none; margin-top: 20px;">
                    <h4>生成的Google搜索鏈接：</h4>
                    <div id="searchLinks"></div>
                </div>
                
                <div class="progress-bar" id="progressBar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                
                <div class="status" id="status">
                    <span>✅ 就緒 - 請填寫公司名稱並點擊生成搜索鏈接</span>
                </div>
            </div>
            
            <div class="results-section">
                <div class="results-header">
                    <h3>📊 搜索结果</h3>
                </div>
                <div class="results-content" id="resultsContent">
                    <div class="no-results" id="noResults">
                        點擊"生成Google搜索鏈接"按鈕創建搜索鏈接<br>
                        點擊鏈接在新標籤頁中查看真實搜索結果
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const searchBtn = document.getElementById('searchBtn');
            const clearBtn = document.getElementById('clearBtn');
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');
            const status = document.getElementById('status');
            const resultsContent = document.getElementById('resultsContent');
            const noResults = document.getElementById('noResults');
            const searchLinksContainer = document.getElementById('searchLinksContainer');
            const searchLinks = document.getElementById('searchLinks');
            
            // 设置日期输入框的默认值
            const today = new Date();
            const thirtyDaysAgo = new Date();
            thirtyDaysAgo.setDate(today.getDate() - 30);
            
            document.getElementById('startDate').valueAsDate = thirtyDaysAgo;
            document.getElementById('endDate').valueAsDate = today;
            
            // 生成Google搜索鏈接
            searchBtn.addEventListener('click', function() {
                const company = document.getElementById('company').value.trim();
                
                if (!company) {
                    alert('請輸入公司名稱');
                    return;
                }
                
                // 顯示進度條
                progressBar.style.display = 'block';
                status.innerHTML = '<span>🔗 生成搜索鏈接中...</span>';
                searchBtn.disabled = true;
                
                // 模擬處理時間
                setTimeout(() => {
                    generateSearchLinks(company);
                    progressBar.style.display = 'none';
                    searchBtn.disabled = false;
                    status.innerHTML = '<span>✅ 搜索鏈接已生成</span>';
                }, 1000);
            });
            
            // 生成Google搜索鏈接
            function generateSearchLinks(company) {
                const startDate = document.getElementById('startDate').value;
                const endDate = document.getElementById('endDate').value;
                const searchMode = document.querySelector('input[name="searchMode"]:checked').value;
                
                // 構建搜索查詢
                let baseQuery = company;
                if (searchMode === 'exact') {
                    baseQuery = `"${company}"`;
                }
                
                // 根據選中的輿情類型構建搜索鏈接
                const riskTypes = [];
                if (document.getElementById('creditRisk').checked) riskTypes.push('信用風險', '債務違約', '評級下調');
                if (document.getElementById('complianceRisk').checked) riskTypes.push('監管處罰', '調查', '合規問題');
                if (document.getElementById('countryRisk').checked) riskTypes.push('制裁', '政治風險', '政策變化');
                if (document.getElementById('operationalRisk').checked) riskTypes.push('經營問題', '管理層變動', '業績下滑');
                if (document.getElementById('legalRisk').checked) riskTypes.push('法律糾紛', '訴訟', '違法');
                
                // 生成搜索鏈接
                searchLinks.innerHTML = '';
                
                // 基本搜索
                const basicQuery = `${baseQuery} 負面消息 OR 負面新聞 OR 風險`;
                const basicUrl = `https://www.google.com/search?q=${encodeURIComponent(basicQuery)}&tbs=cdr:1,cd_min:${startDate},cd_max:${endDate}`;
                const basicLink = document.createElement('a');
                basicLink.href = basicUrl;
                basicLink.target = "_blank";
                basicLink.className = "search-link";
                basicLink.textContent = `🔍 基本負面消息搜索: ${company}`;
                searchLinks.appendChild(basicLink);
                
                // 按輿情類型生成搜索鏈接
                riskTypes.forEach(type => {
                    const typeQuery = `${baseQuery} ${type}`;
                    const typeUrl = `https://www.google.com/search?q=${encodeURIComponent(typeQuery)}&tbs=cdr:1,cd_min:${startDate},cd_max:${endDate}`;
                    const typeLink = document.createElement('a');
                    typeLink.href = typeUrl;
                    typeLink.target = "_blank";
                    typeLink.className = "search-link";
                    typeLink.textContent = `⚠️ ${type}搜索: ${company}`;
                    searchLinks.appendChild(typeLink);
                });
                
                // 綜合搜索
                if (riskTypes.length > 0) {
                    const combinedQuery = `${baseQuery} (${riskTypes.join(' OR ')})`;
                    const combinedUrl = `https://www.google.com/search?q=${encodeURIComponent(combinedQuery)}&tbs=cdr:1,cd_min:${startDate},cd_max:${endDate}`;
                    const combinedLink = document.createElement('a');
                    combinedLink.href = combinedUrl;
                    combinedLink.target = "_blank";
                    combinedLink.className = "search-link";
                    combinedLink.textContent = `📊 綜合負面輿情搜索: ${company}`;
                    searchLinks.appendChild(combinedLink);
                }
                
                // 顯示搜索鏈接容器
                searchLinksContainer.style.display = 'block';
                
                // 更新結果區域
                resultsContent.innerHTML = `
                    <div class="no-results">
                        <h3>Google搜索鏈接已生成！</h3>
                        <p>點擊下方鏈接在新標籤頁中查看真實搜索結果：</p>
                        <ul style="text-align:left; margin-top:20px;">
                            <li>點擊鏈接將在Google中搜索相關負面信息</li>
                            <li>搜索結果包含您設定的日期範圍</li>
                            <li>鏈接會自動過濾相關負面輿情類型</li>
                        </ul>
                    </div>
                `;
            }
            
            // 清空結果
            clearBtn.addEventListener('click', function() {
                searchLinksContainer.style.display = 'none';
                searchLinks.innerHTML = '';
                resultsContent.innerHTML = '<div class="no-results">點擊"生成Google搜索鏈接"按鈕創建搜索鏈接<br>點擊鏈接在新標籤頁中查看真實搜索結果</div>';
                status.innerHTML = '<span>🗑️ 結果已清空</span>';
            });
            
            // 日期驗證
            document.getElementById('startDate').addEventListener('change', validateDates);
            document.getElementById('endDate').addEventListener('change', validateDates);
            
            function validateDates() {
                const startDate = new Date(document.getElementById('startDate').value);
                const endDate = new Date(document.getElementById('endDate').value);
                
                if (startDate > endDate) {
                    alert('起始日期不能晚於結束日期');
                    document.getElementById('endDate').value = document.getElementById('startDate').value;
                }
            }
        });
    </script>
</body>
</html>
